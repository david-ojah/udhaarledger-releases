name: Bug report
description: Report something that is not working
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not include real customer names, balances, PINs, recovery codes, or
        account passwords.** Redact screenshots before uploading.
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in Settings → About.
      placeholder: "1.1.0 (2)"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - Windows
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS version
      placeholder: "Android 14 / Windows 11 23H2"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do before the problem appeared?
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Optional. Logs or screenshots are welcome if personal data is removed.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed customer names, balances, PINs, recovery codes, and account credentials from this report.
          required: true
