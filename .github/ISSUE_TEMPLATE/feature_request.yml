name: Feature request
description: Suggest an improvement for UdhaarLedger
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not include real customer names, balances, PINs, recovery codes, or
        account passwords.**
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the shop workflow or difficulty, not a specific implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Current workarounds or other approaches.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Both
        - Android
        - Windows
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed customer names, balances, PINs, recovery codes, and account credentials from this request.
          required: true
